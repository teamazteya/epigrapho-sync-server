<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tu código de recuperación · Epigrapho</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F7F1E5;color:#1F2A28;font-family:Georgia,'Times New Roman',serif;padding:16px;box-sizing:border-box}
main{max-width:520px;width:100%;background:#fff;border-radius:12px;padding:32px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:22px;color:#3F766D}
h2{margin:0 0 16px;font-size:18px;font-weight:normal}
p{line-height:1.6}
textarea{width:100%;box-sizing:border-box;font-family:Consolas,Menlo,monospace;font-size:13px;padding:12px;border:1px solid #d8d2c4;border-radius:8px;background:#F7F1E5;color:#1F2A28;resize:none}
button{margin-top:12px;background:#3F766D;color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:15px;cursor:pointer}
small{color:#5B6663}
</style></head>
<body><main>
<h1>Epigrapho</h1>
<h2>Este es tu código de recuperación</h2><p>Cópialo y pégalo en Epigrapho, en <strong>Iniciar sesión → ¿Olvidaste tu contraseña? → Pegar código</strong>.</p><textarea id="code" rows="5" readonly>{{code}}</textarea><button id="copy" type="button">Copiar código</button><p><small>No compartas este código: con él se puede cambiar la contraseña de tu cuenta. Si no pediste recuperarla, cierra esta página.</small></p>
</main><script>document.getElementById("copy").onclick=function(){var t=document.getElementById("code");t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(function(){document.execCommand("copy")});this.textContent="Copiado";};</script></body>
</html>
