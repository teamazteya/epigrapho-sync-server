# Epigrapho: publishes the three images the Epigrapho sync server runs to
# GitHub Container Registry, for arm64 (the Oracle A1 VM) and amd64 (local
# tests). Tags look like v1.0-beta.38-ep.1: the upstream tag it is based on and
# an Epigrapho counter.

name: Publish Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push ${{ matrix.repos.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repos:
          - image: ghcr.io/teamazteya/epigrapho-sync
            file: ./Notesnook.API/Dockerfile
            context: .

          - image: ghcr.io/teamazteya/epigrapho-identity
            file: ./Streetwriters.Identity/Dockerfile
            context: .

          - image: ghcr.io/teamazteya/epigrapho-sse
            file: ./Streetwriters.Messenger/Dockerfile
            context: .
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.repos.image }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.repos.context }}
          file: ${{ matrix.repos.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.repos.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repos.image }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ matrix.repos.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
