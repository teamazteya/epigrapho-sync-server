# Epigrapho sync server, as it runs on the Oracle A1 VM (/opt/epigrapho).
# Derived from the upstream docker-compose.yml: no extras, no public ports
# except Caddy's 80/443, and every image pinned to a tag. Shared notes (A5)
# are served by `notas`, built from apps/monograph in the app repo.
# Secrets live in .env next to this file (see .env.example).

x-server-discovery: &server-discovery
  NOTESNOOK_SERVER_PORT: 5264
  NOTESNOOK_SERVER_HOST: notesnook-server
  IDENTITY_SERVER_PORT: 8264
  IDENTITY_SERVER_HOST: identity-server
  SSE_SERVER_PORT: 7264
  SSE_SERVER_HOST: sse-server
  SELF_HOSTED: 1
  IDENTITY_SERVER_URL: https://auth.azteya.tech
  KNOWN_PROXIES: 172.28.0.10

x-env-files: &env-files
  - .env

# Logs carry IP addresses, so they rotate instead of growing forever: at most
# 3 files of 10 MB per service (PRIVACY.md in the app repo says so).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  notesnook-db:
    image: mongo:7.0.12
    hostname: notesnook-db
    restart: unless-stopped
    logging: *logging
    volumes:
      - dbdata:/data/db
    networks: [epigrapho]
    command: --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'try { rs.status() } catch (err) { rs.initiate() }; db.runCommand("ping").ok' | mongosh mongodb://localhost:27017 --quiet
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  # S3 storage for attachments. MinIO stopped publishing images in 2025, so
  # Garage (AGPL-3.0) takes its place; the server only needs S3 with
  # path-style URLs. One-time setup: init-garage.sh.
  notesnook-s3:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    logging: *logging
    networks: [epigrapho]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - s3meta:/var/lib/garage/meta
      - s3data:/var/lib/garage/data

  identity-server:
    image: ghcr.io/teamazteya/epigrapho-identity:${EPIGRAPHO_TAG}
    restart: unless-stopped
    logging: *logging
    volumes:
      # ASP.NET Data Protection keys: without them every deploy voids pending
      # confirmation and recovery links.
      - ./dp-keys/identity-server:/app/.aspnet/DataProtection-Keys
    networks: [epigrapho]
    env_file: *env-files
    depends_on: [notesnook-db]
    healthcheck:
      test: wget --tries=1 -nv -q http://localhost:8264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/identity?replSet=rs0
      MONGODB_DATABASE_NAME: identity

  notesnook-server:
    image: ghcr.io/teamazteya/epigrapho-sync:${EPIGRAPHO_TAG}
    restart: unless-stopped
    logging: *logging
    volumes:
      # ASP.NET Data Protection keys: without them every deploy voids pending
      # confirmation and recovery links.
      - ./dp-keys/notesnook-server:/app/.aspnet/DataProtection-Keys
    networks: [epigrapho]
    env_file: *env-files
    depends_on: [notesnook-s3, identity-server]
    healthcheck:
      test: wget --tries=1 -nv -q http://localhost:5264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/?replSet=rs0
      MONGODB_DATABASE_NAME: notesnook
      S3_INTERNAL_SERVICE_URL: http://notesnook-s3:3900
      S3_INTERNAL_BUCKET_NAME: attachments
      S3_ACCESS_KEY_ID: ${S3_KEY_ID}
      S3_ACCESS_KEY: ${S3_SECRET}
      S3_SERVICE_URL: https://files.azteya.tech
      S3_REGION: us-east-1
      S3_BUCKET_NAME: attachments
      MONOGRAPH_PUBLIC_URL: https://notas.azteya.tech

  sse-server:
    image: ghcr.io/teamazteya/epigrapho-sse:${EPIGRAPHO_TAG}
    restart: unless-stopped
    logging: *logging
    env_file: *env-files
    depends_on: [identity-server, notesnook-server]
    volumes:
      # ASP.NET Data Protection keys: without them every deploy voids pending
      # confirmation and recovery links.
      - ./dp-keys/sse-server:/app/.aspnet/DataProtection-Keys
    networks: [epigrapho]
    healthcheck:
      test: wget --tries=1 -nv -q http://localhost:7264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery

  # The public page of shared notes. It only reads published notes from the
  # API, so it holds nothing worth backing up. The memory cap keeps a burst
  # of link previews from crowding out the sync server.
  notas:
    image: ghcr.io/teamazteya/epigrapho-notas:sha-0cf5e2b
    restart: unless-stopped
    logging: *logging
    networks: [epigrapho]
    depends_on: [notesnook-server]
    mem_limit: 400m
    environment:
      API_HOST: http://notesnook-server:5264
      PUBLIC_API_HOST: https://sync.azteya.tech
      PUBLIC_URL: https://notas.azteya.tech
      # NTV, NBLA and NASB for the desktop app, which carries no key.
      API_BIBLE_KEY: ${API_BIBLE_KEY:-}

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      epigrapho:
        ipv4_address: 172.28.0.10

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    logging: *logging
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  epigrapho:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  dbdata:
  s3meta:
  s3data:
  caddydata:
  caddyconfig:
